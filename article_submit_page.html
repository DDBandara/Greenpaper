<!DOCTYPE html>
<html>
    <head>
        <style>
            option{
                width: 90%;
                height: 20px;
            }
        </style>

        <link rel="stylesheet" href="style.css">
        <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script> -->

    </head>
    <body>
        <header>

        </header>
        <nav>

        </nav>
        <main>
            <div class="main" id="main">
                <div class="m1" id="formbox">
                    <h2 id="formtitle">Article Submit Form</h2>

                    <form action="" id="submitform">

                        <label  for="title">TITLE</label><br>
                        <input type="text" name="articletitle" id="articletitleinput" placeholder="Article Title" ><br><br><br>


                        <label  for="summary">SUMMARY <small>(ONE OR TWO SENTENCES,SHOWN ON THE CARD)</small></label><br>
                        <textarea name="summary" id="articlesummery" placeholder="A short summary of the story "></textarea><br><br><br>

                        <label  for="bodyofarticle">BODY</label><br>
                        <textarea id="my-editor" name="articlebody" placeholder="Write the article here"></textarea><br><br><br>

                        <label for="category">CATEGORY</label><br><br>
                        <select id="category" name="category" class="custom-select" required>
                            
                            <option  disabled selected hidden>Choose a category</option>
                            <option  value="academic">Academic</option>
                            <option value="events" >Events</option>
                            <option value="sports" >Sports</option>
                            <option value="general" >General</option>
                            <option value="campus-news" >Campus News</option>
                            

                        </select><br><br>

                        <label for="artclefiles">IMAGE (OPTIONAL)</label><br><br>
                        
                            
                        <input type="file" id="file" accept="image/png, image/jpeg" ><br><br><br>

                        <input class="button" id="b1" type="button" value="Submit for approval"><br><br>
                        <input class="button" id="b2" type="button" value="Save draft">

                    </form>

                    <div class="how">
                        <div class="how1"><h3>How it works</h3></div>
                        <div class="how1"><h4>1.You submit the article.</h4></div>
                        <div class="how1"><h4>2.An admin reads it.</h4></div>
                        <div class="how1"><h4>3.It is published, or sent back with feedback..</h4></div>
                        
                    </div>
                </div>
                <div id="previwebox">
                    <h2 style="text-align: center;">Artcle previwe</h2>
                 

                </div>
               
            </div>
            

        </main>
